const ATTR={
  colosseum:{title:"The Colosseum",emoji:"🏛️",heroFact:"Built in just 8 years — nearly 2,000 years old",mapUrl:"https://www.google.com/maps/search/?api=1&query=Colosseum+Rome",imageSearch:"https://www.google.com/search?q=Colosseum+Rome+interior&tbm=isch",officialUrl:"https://www.colosseo.it",history:"The Colosseum was commissioned by Emperor Vespasian in AD 72 and inaugurated by his son Titus in AD 80 with 100 days of games. Over 9,000 animals were killed in the opening celebrations alone. The name comes from the Colossus of Nero, a 30-metre bronze statue that once stood beside it.",highlights:[{i:"👥",l:"50,000–80,000 spectators",d:"More than most modern NFL stadiums. Seating was strictly tiered by class. 80 numbered entrances could fill and empty it in under 15 minutes."},{i:"🕳️",l:"The Hypogeum",d:"A two-level labyrinth beneath the floor with 80 elevators. Gladiators, animals, and scenery appeared dramatically through trapdoors."},{i:"🪨",l:"The Arena Floor",d:"Originally wooden planks covered in sand — 'harena' in Latin, where the word 'arena' comes from."},{i:"✨",l:"Symbol against the death penalty",d:"Today, whenever a death sentence is commuted anywhere in the world, Rome lights the Colosseum gold in celebration."}],didYouKnow:"The pockmarks on the Colosseum exterior are where medieval Romans pried out iron clamps to melt down for weapons. Some stones were used to build St. Peter's Basilica.",ourVisit:"Angel Tours Aug 3. Meet at Via delle Terme di Tito 93 — look for the Ivo Tours sign, above Colosseo metro stop. 10:40am–1pm."},
  gladiatorSchool:{title:"Gladiator School",emoji:"⚔️",heroFact:"Train like an actual Roman gladiator",mapUrl:"https://www.google.com/maps/search/?api=1&query=Via+Appia+Antica+18+Roma",imageSearch:"https://www.google.com/search?q=gladiator+school+Rome&tbm=isch",officialUrl:"https://www.gruppostoricoromano.it",history:"The Ludus Magnus stood just east of the Colosseum, connected by an underground tunnel. Gladiators trained for years in specific fighting styles. Today the Gruppo Storico Romano recreates these techniques with historically accurate equipment.",highlights:[{i:"🛡️",l:"Gladiator classes",d:"Learn fighting stances, attack combinations, and defensive techniques of different gladiatorial types."},{i:"🏆",l:"Not just slaves",d:"Many gladiators were volunteers — salary, fame, and status were genuinely attractive."},{i:"🎭",l:"The thumbs up/down myth",d:"Historians now believe both thumbs up AND down signaled death — a closed fist meant mercy."}],didYouKnow:"Gladiators rarely fought to the death — they were expensive professionals. The crowd often voted to spare the loser.",ourVisit:"Aug 3, 5–7pm. Via Appia Antica, 18, Roma. Conf: BR-1413635837. Taxi from hotel ~15-20 min."},
  vatican:{title:"Vatican & Sistine Chapel",emoji:"⛪",heroFact:"Michelangelo painted the ceiling in 4 years — lying on his back",mapUrl:"https://www.google.com/maps/search/?api=1&query=Vatican+Museums+Rome",imageSearch:"https://www.google.com/search?q=Sistine+Chapel+ceiling&tbm=isch",officialUrl:"https://www.museivaticani.va",history:"The Vatican Museums hold 54 galleries accumulated over 500 years. The Sistine Chapel took Michelangelo 4 years and features 343 figures across 5,000 square feet of ceiling. He was 33, had never painted a fresco before, and was furious about taking the commission.",highlights:[{i:"✋",l:"The Creation of Adam",d:"Many art historians believe the shape surrounding God is an anatomically perfect cross-section of the human brain."},{i:"🔮",l:"The Last Judgment",d:"Michelangelo painted himself as a flayed human skin held by Saint Bartholomew — a tortured self-portrait."},{i:"🗺️",l:"Gallery of Maps",d:"40 maps of 16th-century Italy in fresco along a 120-metre corridor, painted in just 3 years."},{i:"🕊️",l:"St. Peter's Basilica",d:"The largest church in the world. The Pietà was carved by Michelangelo at age 24."}],didYouKnow:"Michelangelo painted his own face on Goliath's severed head in the scene of David and Goliath.",ourVisit:"LivTours Aug 4, 7:30am. Conf: LVO 671479. Bus 40 from hotel ~15-20 min, or 10 min taxi."},
  borghese:{title:"Borghese Gardens & Rowboats",emoji:"🌳",heroFact:"Rome's most beautiful park — row a boat through it",mapUrl:"https://www.google.com/maps/search/?api=1&query=Borghese+Gardens+Rome",imageSearch:"https://www.google.com/search?q=Borghese+Gardens+Rome+lake&tbm=isch",officialUrl:"https://www.borghese.gallery",history:"Villa Borghese was built in the early 1600s as the estate of Cardinal Scipione Borghese to house his extraordinary art collection. The 80-hectare gardens are now Rome's most beautiful public park.",highlights:[{i:"🚣",l:"The Rowboat Lake",d:"Rent a rowboat and drift under the umbrella pines. ~€3-5/person for 20 min. No advance booking."},{i:"🎨",l:"Galleria Borghese",d:"Inside: Bernini's Apollo and Daphne, Pluto and Persephone, and six Caravaggios. Separate timed ticket."},{i:"🌲",l:"The umbrella pines",d:"Rome's iconic flat-topped stone pines provide crucial shade in August heat."}],didYouKnow:"Cardinal Borghese arranged for art he wanted to be confiscated on trumped-up charges, then graciously accepted it as a gift.",ourVisit:"Aug 4 afternoon after the Vatican. Open 9:30am–dusk. No advance booking for rowboats. Mostly flat paths."},
  golfCartRome:{title:"Golf Cart City Tour",emoji:"🛺",heroFact:"Cover 10 Rome landmarks in 4 hours",mapUrl:"https://www.google.com/maps/search/?api=1&query=Harry%27s+Bar+Via+Veneto+Rome",imageSearch:"https://www.google.com/search?q=Rome+golf+cart+tour&tbm=isch",officialUrl:null,history:"Angel Tours covers Rome's highlights — Colosseum, Pantheon, Piazza Navona, Trevi Fountain — in 4 hours with a guide narrating the whole way.",highlights:[{i:"⛲",l:"Trevi Fountain",d:"Toss a coin over your left shoulder — legend guarantees your return. ~€1.5 million thrown in per year, all to charity."},{i:"🏛️",l:"The Pantheon",d:"Built 125 AD. The world's largest unreinforced concrete dome. The oculus is 9 metres wide."},{i:"🎭",l:"Piazza Navona",d:"Built on top of an ancient Roman stadium. Bernini's Fountain of the Four Rivers at the centre."}],didYouKnow:"The Pantheon's dome was the world's largest for 1,300 years — surpassed in 1436 by Brunelleschi's dome in Florence.",ourVisit:"Aug 2, 9:30am taxi to Harry's Bar, Via Veneto. Tour runs 10am–2pm. Angel Tours — confirmed via email."},
  david:{title:"Accademia Gallery — Statue of David",emoji:"🗿",heroFact:"17 feet tall, carved from a single block of marble",mapUrl:"https://www.google.com/maps/search/?api=1&query=Galleria+dell+Accademia+Florence",imageSearch:"https://www.google.com/search?q=Michelangelo+David+Florence&tbm=isch",officialUrl:"https://www.galleriaaccademiafirenze.it",history:"Michelangelo's David was commissioned in 1501 when he was 26. The marble block had been abandoned for 25 years. Michelangelo finished it in just over 2 years.",highlights:[{i:"👀",l:"The Eyes",d:"David's eyes are turned toward his enemy Goliath — capturing the moment just before the fight."},{i:"✋",l:"The Hands",d:"Disproportionately large — intentionally. David's weapon was a sling held in his hand."},{i:"📐",l:"The Prisoners",d:"On either side — figures appearing to struggle out of the marble, left deliberately unfinished."}],didYouKnow:"David has a small crack in his left ankle from 1991, when someone attacked it with a hammer.",ourVisit:"Aug 6, 8:15–10am. Order #23054762. ~500m walk from hotel, ~7-8 min. Leave hotel at 8am."},
  galileoMuseum:{title:"Galileo Museum",emoji:"🔭",heroFact:"Galileo's actual telescopes from 1609",mapUrl:"https://www.google.com/maps/search/?api=1&query=Museo+Galileo+Florence",imageSearch:"https://www.google.com/search?q=Galileo+Museum+Florence&tbm=isch",officialUrl:"https://www.museogalileo.it",history:"Galileo discovered Jupiter had four moons in 1609 — the first evidence not everything orbited Earth. The Church put him under house arrest for publishing this. The museum holds two of his original telescopes and his preserved middle finger.",highlights:[{i:"🔭",l:"The Original Telescopes",d:"Two handmade by Galileo in 1609. He discovered Jupiter's four moons in just 10 days."},{i:"☝️",l:"The Finger",d:"Galileo's preserved right middle finger in a glass egg on a pedestal. Removed during reburial in 1737."},{i:"🧲",l:"Working models",d:"Reconstructions visitors can handle — astrolabes, barometers, armillary spheres. Perfect for Axel."}],didYouKnow:"In 1992 — 350 years after his death — Pope John Paul II formally admitted the Church had been wrong to condemn Galileo.",ourVisit:"Aug 7, 9:30am. Conf: 53026. Open 9:30am–6pm. ~1.8km walk from hotel or short taxi."},
  daVinciMuseum:{title:"Da Vinci Museum",emoji:"🎭",heroFact:"Working models of Leonardo's inventions — 500 years early",mapUrl:"https://www.google.com/maps/search/?api=1&query=Leonardo+da+Vinci+Museum+Florence",imageSearch:"https://www.google.com/search?q=Da+Vinci+Museum+Florence+machines&tbm=isch",officialUrl:"https://www.mostredileonardo.com",history:"Leonardo's notebooks contain designs for a helicopter, tank, solar concentrator, and calculator — all centuries before they were built. Florence's Da Vinci Museum brings them to life with full-scale working models.",highlights:[{i:"✈️",l:"The Aerial Screw",d:"Da Vinci's helicopter design from 1489. Fundamentally correct — it just needed an engine 400 years later."},{i:"🛡️",l:"Armoured Vehicle",d:"A 360-degree cannon-armed tank from 1487. The gear mechanism was backwards — possibly intentional."},{i:"🌉",l:"Self-Supporting Bridge",d:"Holds together with interlocking pieces — no nails or rope. The design works perfectly."}],didYouKnow:"Leonardo wrote all his notebooks in mirror script — right to left — only readable in a mirror.",ourVisit:"Aug 7. Jay and Axel while Dana and Grace shop at Santa Maria Novella. Buy tickets on arrival."},
  piazzaleMichelangelo:{title:"Piazzale Michelangelo",emoji:"🌅",heroFact:"The most famous view in Florence",mapUrl:"https://www.google.com/maps/search/?api=1&query=Piazzale+Michelangelo+Florence",imageSearch:"https://www.google.com/search?q=Piazzale+Michelangelo+Florence+sunset&tbm=isch",officialUrl:null,history:"Designed in 1869 by architect Giuseppe Poggi. Commands a panoramic view of the entire Arno Valley — red-tiled rooftops, Brunelleschi's cathedral dome, the Palazzo Vecchio tower. Always open, always free.",highlights:[{i:"🌆",l:"The panorama",d:"The entire city laid out below you — one of the great urban panoramas in the world."},{i:"🌇",l:"Golden hour",d:"The Florence skyline at golden hour turns the stone buildings amber and the Arno gold."},{i:"🚶",l:"Walk back down",d:"The descent through Oltrarno brings you through artisan workshops, wine bars, and local restaurants."}],didYouKnow:"The rose garden just below (Giardino delle Rose) is free, uncrowded, and has views almost as good.",ourVisit:"Aug 5 arrival day — taxi up at ~4pm, walk back down, dinner in Oltrarno."},
  santaMariaNovellaShop:{title:"Santa Maria Novella Pharmacy",emoji:"🌸",heroFact:"The world's oldest pharmacy, founded 1221",mapUrl:"https://www.google.com/maps/search/?api=1&query=Santa+Maria+Novella+Pharmacy+Florence",imageSearch:"https://www.google.com/search?q=Santa+Maria+Novella+pharmacy+Florence&tbm=isch",officialUrl:"https://www.smnovella.com",history:"Founded in 1221 by Dominican monks. By the 16th century they were making perfumes for Catherine de' Medici, who took their fragrance to France when she became Queen — some say this was the origin of French perfumery.",highlights:[{i:"🌹",l:"The fragrances",d:"Complex, botanical, aged. Melograno and Pot Pourri are classics. Rose Water formula dates to 1381."},{i:"🧴",l:"Skin care",d:"Face creams, soaps, and herbal remedies made to centuries-old formulas."},{i:"🎁",l:"Perfect gifts",d:"Wax-sealed bottles, hand-tied ribbons. Small enough for a suitcase, memorable enough to last."}],didYouKnow:"Florence taught Paris how to smell good — Catherine de' Medici's perfumer brought the craft from here to France.",ourVisit:"Aug 7. Dana and Grace while Jay and Axel do Da Vinci. Budget time and money — worth every euro."},
  dogesPalace:{title:"Doge's Palace",emoji:"🏛️",heroFact:"Seat of Venetian power for 700 years — home to the world's largest oil painting",mapUrl:"https://www.google.com/maps/search/?api=1&query=Doge%27s+Palace+Venice",imageSearch:"https://www.google.com/search?q=Doge%27s+Palace+Venice+interior&tbm=isch",officialUrl:"https://palazzoducale.visitmuve.it",history:"The Palazzo Ducale was the centre of Venetian government from the 9th century until 1797. It holds Tintoretto's Paradise — at 22x7 metres, the largest oil painting in the world — and the Bridge of Sighs.",highlights:[{i:"🎨",l:"Tintoretto's Paradise",d:"22m wide, 7m tall, 500 figures. Painted when Tintoretto was 70."},{i:"😮",l:"Bridge of Sighs",d:"Prisoners crossed it after sentencing — their last glimpse of Venice."},{i:"🗝️",l:"Secret Passages",d:"Hidden staircases, spy chambers, and the Piombi — cells where Casanova was imprisoned and escaped."},{i:"⚖️",l:"The Council of Ten",d:"Venice's feared secret police. Power of life and death over any Venetian citizen."}],didYouKnow:"Casanova's escape from the Piombi in 1755 took 15 months of planning. He later wrote a famous memoir about it.",ourVisit:"Aug 9, 9am. Conf: TLITE0138501769814-01. Leave hotel 8:45am (~10-12 min walk). Allow 2 hours minimum."},
  stMarksBasilica:{title:"St. Mark's Basilica",emoji:"⛪",heroFact:"40,000 square feet of gold mosaic",mapUrl:"https://www.google.com/maps/search/?api=1&query=St+Mark%27s+Basilica+Venice",imageSearch:"https://www.google.com/search?q=St+Mark+Basilica+Venice+gold+mosaics&tbm=isch",officialUrl:"https://www.basilicasanmarco.it",history:"Built in 832 AD to house the relics of St. Mark smuggled from Alexandria under pork and cabbages. The current building dates to 1063 and is covered in Byzantine gold mosaics that earned it the nickname 'the Golden Church.'",highlights:[{i:"✨",l:"The Gold Mosaics",d:"Every surface covered with 40,000 square feet of gold mosaic. Glows like it's lit from inside."},{i:"🐴",l:"The Bronze Horses",d:"Stolen from Constantinople 1204, stolen by Napoleon 1797, returned to Venice 1815."},{i:"💎",l:"Pala d'Oro",d:"The golden altarpiece with 2,000 gems. Small extra fee — worth it."}],didYouKnow:"The body of St. Mark is believed buried beneath the high altar. When installed, they were placed inside and promptly 'lost.'",ourVisit:"Aug 9, 4–5pm. Conf: 171-TUMZZZP. Open Sunday 2–5:15pm. Cover shoulders and knees."},
  acquaAltaBookshop:{title:"Libreria Acqua Alta",emoji:"📚",heroFact:"Books in gondolas, bathtubs, and a staircase of encyclopaedias",mapUrl:"https://www.google.com/maps/search/?api=1&query=Libreria+Acqua+Alta+Venice",imageSearch:"https://www.google.com/search?q=Libreria+Acqua+Alta+Venice+cats&tbm=isch",officialUrl:null,history:"Created by Luigi Frizzo near the Rialto. Because the shop floods regularly, Frizzo began storing books in gondolas, bathtubs, and waterproof barrels. What started practical became one of Venice's most beloved places.",highlights:[{i:"🚣",l:"Books in gondolas",d:"A full-sized gondola filled to overflowing with books in a dozen languages."},{i:"😺",l:"The cats",d:"Several cats live permanently. They sleep on the books and sit in the gondola."},{i:"📖",l:"The book staircase",d:"A staircase of old encyclopaedias leads to the canal wall. Beautiful view from the top."}],didYouKnow:"No real organization system — arranged by the owner's intuition. Somehow you always find something interesting.",ourVisit:"Aug 9, 10:30am. 10-minute walk from Doge's Palace. Great for cheap souvenirs."},
  gondolaRide:{title:"Gondola Ride",emoji:"🚣",heroFact:"400 gondoliers in Venice — all male until 2010",mapUrl:"https://www.google.com/maps/search/?api=1&query=gondola+ride+Venice",imageSearch:"https://www.google.com/search?q=Venice+gondola+sunset&tbm=isch",officialUrl:null,history:"The gondola has been Venice's symbol for over 1,000 years. Each is handmade, slightly asymmetric, weighs 350kg, and takes two months to build from eight types of wood. A 1609 law decreed all must be painted black.",highlights:[{i:"⬛",l:"Why are they black?",d:"A 1609 law banned ornate gondolas to stop wealthy Venetians competing over who had the most elaborate boat."},{i:"🎵",l:"The singing",d:"Serenading gondoliers are real — request and pay extra. Beautiful acoustics under the bridges."},{i:"🌅",l:"Golden hour",d:"45 minutes before sunset. Buildings turn gold, canals reflect the sky. Negotiate on-site."}],didYouKnow:"In 2010, Giorgia Boscolo became the first female gondolier after fighting the guild for years.",ourVisit:"Aug 8 arrival evening. Book via hotel concierge on arrival. ~€80 for 30 minutes."},
  venetianMasks:{title:"Ca' Macana Mask Workshop",emoji:"🎭",heroFact:"The atelier that made masks for Eyes Wide Shut",mapUrl:"https://www.google.com/maps/search/?api=1&query=Ca+Macana+Dorsoduro+3215+Venice",imageSearch:"https://www.google.com/search?q=Ca+Macana+Venice+mask+workshop&tbm=isch",officialUrl:"https://www.camacana.com",history:"Venice's carnival masks have a 1,000-year history. Ca' Macana, founded 1984, is one of Venice's oldest traditional mask-making workshops and made all masks for Stanley Kubrick's Eyes Wide Shut.",highlights:[{i:"🎬",l:"Eyes Wide Shut",d:"Kubrick commissioned Ca' Macana for the famous masked ball sequence (1999)."},{i:"🎨",l:"The craft",d:"Papier-mâché, painted with tempera, lacquered, decorated with feathers, gems, and gold leaf."},{i:"🃏",l:"Commedia dell'Arte",d:"Many classic Venice mask types come from this improvised theatrical tradition."}],didYouKnow:"At peak Venetian Carnival in the 18th century, the mask-wearing season lasted about four months.",ourVisit:"Aug 8, 4–5pm. Dorsoduro 3215. Conf: 20260715CMCN133368483. Leave hotel 3:40pm (~12-15 min walk). Pay in Euros."},
  gotDubrovnik:{title:"Game of Thrones Tour — Dubrovnik",emoji:"🐉",heroFact:"King's Landing is real",mapUrl:"https://www.google.com/maps/search/?api=1&query=Pile+Gate+Dubrovnik",imageSearch:"https://www.google.com/search?q=Dubrovnik+Game+of+Thrones+filming+locations&tbm=isch",officialUrl:null,history:"Dubrovnik was chosen as the primary filming location for King's Landing in 2011. The medieval walled city required almost no set dressing. Over 8 seasons, dozens of locations appeared on screen.",highlights:[{i:"🏰",l:"Fort Lovrijenac — the Red Keep",d:"The fortress on the cliff stood in for the Red Keep where Cersei and Joffrey plotted."},{i:"😰",l:"The Walk of Shame",d:"The actual steps of the Jesuit Church where Cersei's Walk of Atonement was filmed."},{i:"🗺️",l:"The City Walls",d:"The 2km wall walk gives you the elevated view familiar from the show's establishing shots."}],didYouKnow:"HBO paid Croatia approximately €2 million per season to film in Dubrovnik.",ourVisit:"Aug 11, 11:30am–3:30pm. Private guide Dario — €180 cash total. Meet at Pile Gate. Ship arrives 10am."},
  amalfiBoat:{title:"Amalfi Coast by Boat",emoji:"⛵",heroFact:"The only way to truly see the Amalfi Coast",mapUrl:"https://www.google.com/maps/search/?api=1&query=Pontili+Elidiport+Molo+Manfredi+Salerno",imageSearch:"https://www.google.com/search?q=Amalfi+Coast+boat+Positano+sea&tbm=isch",officialUrl:null,history:"The Amalfi Coast stretches 50km along the Sorrentine Peninsula. The cliff-hugging towns cling to near-vertical rock faces above the Tyrrhenian Sea. UNESCO World Heritage Site since 1997.",highlights:[{i:"🌊",l:"Positano from the sea",d:"Pastel houses cascading down the cliff to the beach — you'll drift along it at low speed."},{i:"🏊",l:"Swimming stops",d:"Blu Mediterraneo anchors at sea caves and grottos. Water is extraordinarily clear in August."},{i:"🍋",l:"Limoncello country",d:"The enormous Sfusato amalfitano lemons — you'll see groves terraced up the cliffs."}],didYouKnow:"Amalfi created the world's first maritime code of law in the 9th century, governing Mediterranean trade for centuries.",ourVisit:"Aug 14, 9:30am. Meet at Pontili Elidiport, Molo Manfredi, Salerno. Blu Mediterraneo — confirmed via email."},
  pisaTower:{title:"Leaning Tower of Pisa",emoji:"🗼",heroFact:"It started leaning during construction — they kept building anyway",mapUrl:"https://www.google.com/maps/search/?api=1&query=Piazza+dei+Miracoli+Pisa",imageSearch:"https://www.google.com/search?q=Leaning+Tower+Pisa+climb&tbm=isch",officialUrl:"https://www.opapisa.it",history:"Construction began in 1173 and almost immediately tilted due to soft soil. Construction halted twice — nearly 100 years total. Ironically these pauses may have saved it: the soil had time to compress.",highlights:[{i:"📐",l:"The lean",d:"About 4 degrees off vertical. Engineering work 1990-2001 actually reduced the lean slightly."},{i:"👣",l:"251 steps",d:"Marble steps spiraling around the hollow centre. You feel the lean changing as you climb."},{i:"⚗️",l:"Galileo's experiment",d:"Galileo allegedly dropped cannonballs of different weights from the top to prove mass doesn't affect gravity."}],didYouKnow:"The Tower is not actually the most tilted building in the world — the Suurhusen church tower in Germany leans more.",ourVisit:"Aug 16, 9am. Piazza dei Miracoli. Conf: 2228643737-01. Meet Bella Italia driver at 8am. ⚠️ Leave ALL bags at cloakroom."},
  cinqueTerre:{title:"Cinque Terre — Bella Italia Tour",emoji:"🏖️",heroFact:"Three dramatic cliffside villages after Pisa",mapUrl:"https://www.google.com/maps/search/?api=1&query=Manarola+Cinque+Terre",imageSearch:"https://www.google.com/search?q=Cinque+Terre+Manarola+coast&tbm=isch",officialUrl:null,history:"The five villages of the Cinque Terre grew around fishing and terraced agriculture, remaining isolated until rail links connected them. Today they are among Italy's most protected and visited coastlines.",highlights:[{i:"🌊",l:"Manarola",d:"The most photographed village — colourful houses stacked on the cliff edge above the sea."},{i:"🏘️",l:"Vernazza",d:"The only village with a small harbour. Castle ruins above, pastel buildings below, crystal water."},{i:"🏖️",l:"Monterosso al Mare — snorkeling",d:"The largest village and the only one with a real sandy beach. Your snorkeling stop."}],didYouKnow:"The Cinque Terre hiking trails are among Italy's most famous. Your tour avoids the crowds entirely.",ourVisit:"Aug 16, after Pisa. Bella Italia tour Conf: RRWPQGJ. Manarola → Vernazza → Monterosso (snorkeling). Return to Livorno by 5pm."},
  sagradaFamilia:{title:"Sagrada Família",emoji:"⛪",heroFact:"Under construction since 1882 — Gaudí is buried in the crypt",mapUrl:"https://www.google.com/maps/search/?api=1&query=Sagrada+Familia+Barcelona",imageSearch:"https://www.google.com/search?q=Sagrada+Familia+interior+columns+light&tbm=isch",officialUrl:"https://www.sagradafamilia.org",history:"Antoni Gaudí took over in 1883 at age 31 and spent 43 years on it, living on-site for the final 15 years. In 1926 he was hit by a tram — initially unrecognized and almost buried as a pauper. He left only 25% complete.",highlights:[{i:"🌲",l:"The Forest Interior",d:"Columns branch like trees toward the ceiling. Light comes through stained glass in greens, blues, and ambers."},{i:"🏗️",l:"Still being built",d:"Expected to complete ~2026. The central tower will reach 172.5 metres."},{i:"🕊️",l:"Three facades",d:"Nativity Facade (east) was the only one Gaudí saw finished. Passion Facade (west) looks like bones."}],didYouKnow:"When Gaudí died, his pocket contained only an orange, a handful of almonds, and his rosary.",ourVisit:"Aug 19, 4–5:30pm. Conf: 101590685. Audioguide included. Metro L1→L2 (~20 min) or 15 min taxi."},
  parkGuell:{title:"Park Güell",emoji:"🌿",heroFact:"Gaudí's mosaic wonderland — a failed luxury housing development",mapUrl:"https://www.google.com/maps/search/?api=1&query=Park+Guell+Barcelona",imageSearch:"https://www.google.com/search?q=Park+Guell+Barcelona+mosaic&tbm=isch",officialUrl:"https://www.parkguell.barcelona",history:"Commissioned in 1900 for a luxury garden suburb — 60 plots for wealthy buyers. Only two houses sold. Abandoned 1914, the city took over. What resulted was extraordinary mosaic terraces and fairy-tale gatehouses.",highlights:[{i:"🦎",l:"The Dragon Staircase",d:"The famous mosaic salamander/dragon — the symbol of Barcelona."},{i:"🪑",l:"The Great Terrace",d:"The undulating ceramic bench with sweeping views of Barcelona and the sea."},{i:"🏛️",l:"The Hypostyle Room",d:"86 columns supporting the Great Terrace above, ceiling in mosaic roundels."}],didYouKnow:"Gaudí lived in Park Güell from 1906 until 1925 and went to confession every day.",ourVisit:"Aug 21, 9am. Ref: 700586731861. Book timed Monumental Zone entry. Morning before crowds."},
  montserrat:{title:"Montserrat Day Trip",emoji:"⛰️",heroFact:"A jagged mountain monastery that inspired Wagner",mapUrl:"https://www.google.com/maps/search/?api=1&query=Montserrat+Monastery+Barcelona",imageSearch:"https://www.google.com/search?q=Montserrat+monastery+mountain&tbm=isch",officialUrl:null,history:"Montserrat rises 1,236 metres northwest of Barcelona. Its serrated peaks inspired Wagner's opera Parsifal. The Benedictine monastery has been on the mountain since the 9th century and houses La Moreneta — the Black Madonna.",highlights:[{i:"🖤",l:"La Moreneta — the Black Madonna",d:"Carved from poplar wood around 1100 AD. Pilgrims queue to touch her hand."},{i:"🚡",l:"Cable car up",d:"Aeri de Montserrat — 5 minutes, spectacular. You rise almost vertically to the monastery."},{i:"🥾",l:"Sant Joan funicular",d:"A second funicular goes higher. Trails lead to the highest peak — views to the Pyrenees and sea."}],didYouKnow:"During the Spanish Civil War, Montserrat was one of the few places where the Catalan language was openly maintained.",ourVisit:"Aug 20. Leave hotel 8:15am (~6 min walk to Plaça Espanya). R5 train 8:36am. Back in Barcelona 2:15pm."},
  cosmoCaixa:{title:"CosmoCaixa Science Museum",emoji:"🔭",heroFact:"A living Amazon rainforest inside a museum",mapUrl:"https://www.google.com/maps/search/?api=1&query=CosmoCaixa+Barcelona",imageSearch:"https://www.google.com/search?q=CosmoCaixa+Barcelona+Amazon+rainforest&tbm=isch",officialUrl:"https://www.cosmocaixa.org",history:"One of Europe's most innovative science museums. Its signature exhibit is the Bosc Inundat: a real, living 1,000-square-metre Amazon rainforest ecosystem with piranhas, anacondas, caiman, and hundreds of plant species.",highlights:[{i:"🌿",l:"The Amazon Rainforest",d:"Over 100 animal species. Piranhas swim. An anaconda lives here. Real rain falls."},{i:"🪨",l:"The Geological Wall",d:"A cross-section through 100 rock types showing 4.5 billion years of Earth history."},{i:"🌌",l:"Planetarium",d:"Full-dome digital planetarium. The 3D solar system tour is remarkable."}],didYouKnow:"Maintaining the tropical Amazon microclimate in Barcelona requires a complex system running 24 hours a day.",ourVisit:"Aug 21 afternoon. Perfect for Axel's last full day in Europe. Then Barceloneta Beach."}

function showTab(tab){
  currentTab=tab;currentDay=null;currentAttr=null;currentCity=null;
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('screen-'+tab).classList.add('active');
  document.getElementById('nav-'+tab).classList.add('active');
  render();
}

function render(){
  if(currentTab==="itinerary") renderItinerary();
  if(currentTab==="cities") renderCities();
  if(currentTab==="logistics") renderLogistics();
  if(currentTab==="gf") renderGF();
}

// ---- HELPERS ----
function ac(phase){return (PC[phase]||PC.london).a;}
function badge(s){
  if(!s)return'';
  if(s==="✅")return'<span class="tag confirmed">Confirmed</span>';
  if(s&&s.includes("Pending"))return'<span class="tag pending">Pending</span>';
  return'<span class="tag booknow">Book Now</span>';
}
function el(tag,attrs,inner){
  const a=Object.entries(attrs||{}).map(([k,v])=>`${k}="${v}"`).join(' ');
  return`<${tag}${a?' '+a:''}>${inner||''}</${tag}>`;
}

// ---- ATTR DETAIL ----

    <button class="back-btn" onclick="${backFn}()">← Back</button>
    <div class="hero" style="background:linear-gradient(135deg,${acc}22,${acc}08);border:1px solid ${acc}40">

}

  if(currentAttr){renderAttr(currentAttr,'backFromAttr',ac(currentDay?.phase));return;}
  if(currentDay){renderDayDetail();return;}
  const phases=[{k:"all",l:"All"},{k:"london",l:"🇬🇧 London"},{k:"rome",l:"🇮🇹 Rome"},{k:"florence",l:"🇮🇹 Florence"},{k:"venice",l:"🇮🇹 Venice"},{k:"cruise",l:"🚢 Cruise"},{k:"barcelona",l:"🇪🇸 Barcelona"}];
  const filtered=itinFilterType==="city"?(itinFilterPhase==="all"?DAYS:DAYS.filter(d=>d.phase===itinFilterPhase)):(itinFilterDay==="all"?DAYS:DAYS.filter(d=>d.id===parseInt(itinFilterDay)));
  el.innerHTML=`
    <div style="display:flex;gap:6px;margin-bottom:12px">
      <button class="filter-btn${itinFilterType==='city'?' active':''}" onclick="setItinFilter('city')">By Destination</button>
      <button class="filter-btn${itinFilterType==='day'?' active':''}" onclick="setItinFilter('day')">Jump to Day</button>
    </div>
    ${itinFilterType==='city'?`<div class="pills">${phases.map(p=>{const col=PC[p.k]?.a||'#7B6FF0';const act=itinFilterPhase===p.k;return`<button class="pill${act?' active':''}" style="${act?`background:${col};border-color:${col};color:#fff`:''}" onclick="setPhase('${p.k}')">${p.l}</button>`;}).join('')}</div>`:`<select onchange="setItinDay(this.value)"><option value="all">— Select a day —</option>${DAYS.map(d=>`<option value="${d.id}"${itinFilterDay==d.id?' selected':''}>${d.day} ${d.date} — ${d.city}</option>`).join('')}</select>`}
    ${filtered.map(day=>{const col=ac(day.phase);return`<div class="card clickable" style="border-left:3px solid ${col}" onclick="openDay(${day.id})">
      <div style="display:flex;align-items:center;gap:10px">
        <div style="background:${col}20;border:1px solid ${col}50;border-radius:8px;min-width:46px;height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0">
          <span style="font-size:20px;line-height:1">${day.flag}</span>
          <span style="color:${col};font-size:9px;font-weight:700;margin-top:2px">${day.date}</span>
        </div>
        <div style="flex:1;min-width:0">
          <div style="color:#f0f4ff;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${day.city}</div>
          <div style="color:#94a3b8;font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${day.schedule?.[0]?.a||'—'}</div>
        </div>
        <span style="color:#475569;font-size:18px">›</span>
      </div>
    </div>`;}).join('')}
  `;
}

function renderDayDetail(){
  const day=currentDay;
  const col=ac(day.phase);
  const el=document.getElementById('screen-itinerary');
  el.innerHTML=`
    <button class="back-btn" onclick="backFromDay()">← Back</button>
    <div class="hero" style="background:linear-gradient(135deg,${col}20,${col}08);border:1px solid ${col}40">
      <div style="font-size:28px;margin-bottom:5px">${day.flag}</div>
      <div style="color:#f0f4ff;font-weight:800;font-size:22px;line-height:1.2;margin-bottom:3px">${day.city}</div>
      <div style="color:${col};font-weight:600;font-size:13px">${day.day}, ${day.date}</div>
      ${day.hotel&&day.hotel!=='—'?`<div style="color:#94a3b8;font-size:13px;margin-top:8px">🏨 ${day.hotel}</div>`:''}
      ${day.notes?`<div class="note">${day.notes}</div>`:''}
    </div>
    <div class="section-label" style="color:${col}">Daily Rundown</div>
    ${day.schedule.map((item,i)=>`
      <div style="display:flex;gap:10px;margin-bottom:12px">
        <div style="display:flex;flex-direction:column;align-items:center">
          <div class="timeline-dot" style="background:${col}20;border:1px solid ${col}40">${TI[item.tp]||'📌'}</div>
          ${i<day.schedule.length-1?`<div class="timeline-line" style="background:${col}25"></div>`:''}
        </div>
        <div style="flex:1;padding-bottom:2px">
          <div style="color:#7c9cbf;font-size:11px;font-weight:600;margin-bottom:2px">${item.t}</div>
          <div style="color:#f0f4ff;font-weight:600;font-size:14px;line-height:1.35">${item.a}</div>
          ${item.d?`<div style="color:#94a3b8;font-size:13px;margin-top:3px;line-height:1.5">${item.d}</div>`:''}
          ${item.map?`<a href="${item.map}" target="_blank" style="color:#60C8F5;font-size:12px;text-decoration:none;font-weight:600;margin-top:3px;display:inline-block">📍 Map →</a>`:''}
        </div>
      </div>`).join('')}
    ${day.attrs?.length?`<div class="section-label" style="color:${col};margin-top:8px">📖 Learn More</div>${day.attrs.map(k=>{const a=ATTR[k];if(!a)return'';return`<div class="attr-btn" style="border-color:${col}30" onclick="openAttrFromDay('${k}')"><span style="font-size:22px">${a.emoji}</span><div style="flex:1"><div style="color:#f0f4ff;font-weight:700;font-size:14px">${a.title}</div><div style="color:#64748b;font-size:12px;margin-top:2px">${a.heroFact}</div></div><span style="color:${col};font-size:16px">›</span></div>`;}).join('')}`:''}
    ${day.confs?.length?`<div class="conf-box"><div class="section-label" style="color:#60C8F5">🎫 Confirmations</div>${day.confs.map(c=>`<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:6px"><span style="color:#94a3b8;font-size:13px">${c.l}</span><span class="code">${c.v}</span></div>`).join('')}</div>`:''}
    ${day.todos?.length?`<div class="todo-box"><div class="section-label" style="color:#fbbf24">⚠️ Still To Do</div>${day.todos.map(t=>`<div style="color:#fde68a;font-size:13px;margin-bottom:6px;display:flex;gap:8px;line-height:1.5"><span style="color:#f59e0b;flex-shrink:0">•</span><span>${t}</span></div>`).join('')}</div>`:''}
    ${day.emergency?`<div class="emergency-box"><div style="color:#f87171;font-weight:700;font-size:12px;margin-bottom:5px;text-transform:uppercase;letter-spacing:1px">🚨 Emergency</div><div style="color:#fca5a5;font-size:13px;line-height:1.5">${day.emergency}</div>${day.pharmacy?`<div style="color:#fca5a5;font-size:13px;margin-top:5px;line-height:1.5">💊 ${day.pharmacy}</div>`:''}</div>`:''}
  `;
}

function setItinFilter(t){itinFilterType=t;renderItinerary();}
function setPhase(p){itinFilterPhase=p;renderItinerary();}
function setItinDay(v){itinFilterDay=v;renderItinerary();}
function openDay(id){currentDay=DAYS.find(d=>d.id===id);currentAttr=null;renderItinerary();}
function backFromDay(){currentDay=null;currentAttr=null;renderItinerary();}
function openAttrFromDay(key){currentAttr=key;renderItinerary();}
function backFromAttr(){currentAttr=null;if(currentDay)renderDayDetail();else renderItinerary();}

// ---- CITIES ----
function renderCities(){
  const el=document.getElementById('screen-cities');
  if(currentAttr&&currentCity){renderAttr(currentAttr,'backFromCityAttr',CITIES.find(c=>c.key===currentCity)?.accent);return;}
  if(currentCity){renderCityDetail();return;}
  el.innerHTML=`
    <div style="color:#94a3b8;font-size:14px;line-height:1.6;margin-bottom:18px">Tap a city to explore what we're doing there, learn the history, and get insider tips.</div>
    ${CITIES.map(c=>`<div class="card clickable" style="border-left:3px solid ${c.accent}" onclick="openCity('${c.key}')">
      <div style="display:flex;align-items:center;gap:12px">
        <span style="font-size:30px">${c.flag}</span>
        <div style="flex:1"><div style="color:#f0f4ff;font-weight:700;font-size:16px">${c.name}</div><div style="color:#94a3b8;font-size:13px;margin-top:2px;font-style:italic">${c.tagline}</div></div>
        <span style="color:#475569;font-size:20px">›</span>
      </div>
    </div>`).join('')}
  `;
}

function renderCityDetail(){
  const c=CITIES.find(x=>x.key===currentCity);
  const el=document.getElementById('screen-cities');
  el.innerHTML=`
    <button class="back-btn" onclick="backFromCity()">← All Cities</button>
    <div class="hero" style="background:linear-gradient(135deg,${c.accent}22,${c.accent}08);border:1px solid ${c.accent}40">
      <div style="font-size:32px;margin-bottom:6px">${c.flag}</div>
      <div style="color:#f0f4ff;font-weight:800;font-size:24px;line-height:1.2;margin-bottom:5px">${c.name}</div>
      <div style="color:${c.accent};font-weight:600;font-size:13px;margin-bottom:12px;font-style:italic">${c.tagline}</div>
      <div style="color:#cbd5e1;font-size:14px;line-height:1.7">${c.intro}</div>
      <a href="${c.search}" target="_blank" style="display:inline-block;margin-top:14px;color:#60C8F5;font-size:13px;text-decoration:none;font-weight:600">🔍 Google tips for ${c.name} →</a>
    </div>
    <div class="section-label" style="color:${c.accent}">What We're Doing There</div>
    ${c.highlights.map(h=>`
      <div class="card${h.attr?' clickable':''}" style="border:1px solid ${h.attr?c.accent+'40':'#1e3352'};display:flex;gap:12px;align-items:flex-start" ${h.attr?`onclick="openCityAttr('${h.attr}')"`:''}> 
        <span style="font-size:26px;flex-shrink:0;margin-top:2px">${h.icon}</span>
        <div style="flex:1;min-width:0">
          <div style="color:#f0f4ff;font-weight:700;font-size:14px;margin-bottom:3px">${h.title}</div>
          <div style="color:#94a3b8;font-size:13px;line-height:1.45">${h.desc}</div>
          ${h.attr?`<div style="color:${c.accent};font-size:12px;margin-top:5px;font-weight:600">Tap for full history & highlights →</div>`:''}
          ${!h.attr&&h.url?`<a href="${h.url}" target="_blank" onclick="event.stopPropagation()" style="color:#60C8F5;font-size:12px;margin-top:4px;display:inline-block;text-decoration:none">Website ↗</a>`:''}
          ${h.map?`<a href="${h.map}" target="_blank" onclick="event.stopPropagation()" style="color:#60C8F5;font-size:12px;margin-top:4px;display:inline-block;text-decoration:none;margin-left:${h.url&&!h.attr?'10px':'0'}">📍 Map →</a>`:''}
        </div>
        ${h.attr?`<span style="color:${c.accent};font-size:18px;flex-shrink:0">›</span>`:''}
      </div>`).join('')}
    <div style="background:#0e1e33;border:1px solid #1e3352;border-radius:12px;padding:16px;margin-top:6px">
      <div class="section-label" style="color:#fbbf24">💡 Insider Tips</div>
      ${c.tips.map(t=>`<div style="color:#cbd5e1;font-size:13px;line-height:1.55;margin-bottom:7px;display:flex;gap:8px"><span style="color:#fbbf24;flex-shrink:0">✦</span><span>${t}</span></div>`).join('')}
    </div>
  `;
}

function openCity(key){currentCity=key;currentAttr=null;renderCities();}
function backFromCity(){currentCity=null;currentAttr=null;renderCities();}
function openCityAttr(key){currentAttr=key;renderCities();}
function backFromCityAttr(){currentAttr=null;renderCityDetail();}

// ---- LOGISTICS ----
function renderLogistics(){
  const el=document.getElementById('screen-logistics');
  el.innerHTML=`
    <div style="display:flex;gap:8px;margin-bottom:18px">
      <button onclick="setLog('hotels')" style="background:${logView==='hotels'?'#00C4D8':'#152033'};border:1.5px solid ${logView==='hotels'?'#00C4D8':'#1e3352'};color:${logView==='hotels'?'#0D1B3E':'#94a3b8'};border-radius:20px;padding:8px 18px;font-size:13px;font-weight:700">🏨 Hotels</button>
      <button onclick="setLog('transport')" style="background:${logView==='transport'?'#00C4D8':'#152033'};border:1.5px solid ${logView==='transport'?'#00C4D8':'#1e3352'};color:${logView==='transport'?'#0D1B3E':'#94a3b8'};border-radius:20px;padding:8px 18px;font-size:13px;font-weight:700">🚂 Transport</button>
    </div>
    ${logView==='hotels'?HOTELS.map(h=>`<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
        <div style="color:#00C4D8;font-weight:700;font-size:13px">${h.city}</div>
        <span class="tag confirmed">Confirmed</span>
      </div>
      <a href="${h.url}" target="_blank" style="color:#f0f4ff;font-weight:700;font-size:15px;text-decoration:none;border-bottom:1px dashed #3a5070;padding-bottom:1px">${h.name} ↗</a>
        ${h.mapUrl?`<a href="${h.mapUrl}" target="_blank" style="display:inline-block;margin-left:10px;color:#60C8F5;font-size:12px;text-decoration:none;font-weight:600">📍 Map →</a>`:''}
      <div style="color:#7c9cbf;font-size:13px;margin-top:7px;margin-bottom:5px">${h.dates}</div>
      ${h.conf&&h.conf!=='—'&&h.conf!=='N/A'?`<div style="color:#94a3b8;font-size:13px;margin-bottom:4px">Conf: <span class="code">${h.conf}</span></div>`:''}
      <div style="color:#7c9cbf;font-size:13px">${h.notes}</div>
    </div>`).join(''):TRANSPORT.map(f=>`<div class="card">
      <div style="display:flex;justify-content:space-between;margin-bottom:6px">
        <div style="color:#9B8FFF;font-weight:700;font-size:13px">${f.date}</div>
        <span class="tag ${f.conf==='🔵 Pending'?'pending':'confirmed'}">${f.conf==='🔵 Pending'?'Pending':'Confirmed'}</span>
      </div>
      <div style="color:#f0f4ff;font-weight:700;font-size:15px;margin-bottom:5px">${f.route}</div>
      <div style="color:#94a3b8;font-size:13px;margin-bottom:3px">${f.carrier} · ${f.time}</div>
      <div style="color:#7c9cbf;font-size:13px;margin-bottom:${f.conf&&f.conf!=='—'?'5':'0'}px">${f.cls}</div>
      ${f.conf&&f.conf!=='—'&&f.conf!=='🔵 Pending'?`<div style="color:#94a3b8;font-size:13px">Conf: <span class="code">${f.conf}</span></div>`:''}
    </div>`).join('')}
  `;
}
function setLog(v){logView=v;renderLogistics();}

// ---- GF ----
function renderGF(){
  const el=document.getElementById('screen-gf');
  const cities=[...new Set(GF.map(g=>g.city))];
  el.innerHTML=`
    <div style="background:rgba(74,222,128,0.08);border:1px solid rgba(74,222,128,0.2);border-radius:12px;padding:14px;margin-bottom:18px">
      <div style="color:#4ade80;font-weight:700;font-size:15px;margin-bottom:5px">🌾 Jay's Celiac Travel Guide</div>
      <div style="color:#94a3b8;font-size:13px;line-height:1.6">Key phrase: <span style="color:#f0f4ff;font-style:italic">"Sono celiaco – senza glutine per favore"</span></div>
    </div>
    ${cities.map(city=>`<div style="margin-bottom:20px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div style="color:#4ade80;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:1px">${city}</div>
        <a href="https://www.google.com/search?q=gluten+free+celiac+${encodeURIComponent(city)}" target="_blank" style="color:#60C8F5;font-size:12px;font-weight:600;text-decoration:none;background:rgba(96,200,245,0.1);padding:4px 11px;border-radius:12px">Search ${city} →</a>
      </div>
      ${GF.filter(g=>g.city===city).map(g=>`<div class="card">
        <div style="display:flex;justify-content:space-between;margin-bottom:5px;flex-wrap:wrap;gap:4px">
          <div style="color:#f0f4ff;font-weight:600;font-size:14px">${g.url?`<a href="${g.url}" target="_blank" style="color:#f0f4ff;text-decoration:none;border-bottom:1px dashed #3a5070">${g.name} ↗</a>`:g.name}</div>
          <span class="gf-tag">${g.type}</span>
        </div>
        <div style="color:#94a3b8;font-size:13px;line-height:1.55">${g.notes}</div>
          ${g.map?`<a href="${g.map}" target="_blank" style="color:#60C8F5;font-size:12px;text-decoration:none;font-weight:600;margin-top:4px;display:inline-block">📍 Map →</a>`:''}
      </div>`).join('')}
    </div>`).join('')}
  `;
}

// ---- INIT ----
render();

</script>
</body>
</html>
